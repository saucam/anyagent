name: Release

# Publishes @saucam/anyagent to npm when you publish a GitHub Release.
#
# Auth is npm Trusted Publishing (OIDC) — no token, no 2FA prompt, provenance
# is automatic. Prerequisite (one time): on npmjs.com → @saucam/anyagent →
# Settings → Trusted Publisher → GitHub Actions → repo `saucam/anyagent`,
# workflow `release.yml`. The `id-token: write` permission below is what lets
# the runner mint a short-lived publish credential.
#
# To ship: cut a release from the GitHub UI (Releases → Draft a new release →
# tag vX.Y.Z, where X.Y.Z matches package.json) and this workflow publishes it.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC: lets npm trusted publishing mint a short-lived token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify version matches the release tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json is $PKG but the release tag is $TAG. Bump package.json first."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: trusted publishing authenticates via OIDC, and adds
      # the provenance attestation automatically.
      - name: Publish to npm
        run: npm publish --access public
