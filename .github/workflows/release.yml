name: Release

# Publishes anyagent to npm when you publish a GitHub Release.
#
# Two ways to authenticate (pick one):
#
#  A) npm Trusted Publishing (OIDC) — RECOMMENDED, no long-lived token.
#     1. Publish once manually (`npm publish --access public`) so the package exists.
#     2. On npmjs.com → package → Settings → Trusted Publishers, add this repo +
#        the `release.yml` workflow.
#     3. Delete the NPM_TOKEN secret; the `id-token: write` permission below does
#        the rest, and `--provenance` is automatic.
#
#  B) Automation token — simplest to start.
#     1. npmjs.com → Access Tokens → Generate → "Automation".
#     2. Repo → Settings → Secrets → Actions → add `NPM_TOKEN`.
#
# Either way: cut a release from the GitHub UI (Releases → Draft a new release →
# tag vX.Y.Z) and this workflow publishes that version.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # enables npm provenance / OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify version matches the release tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json is $PKG but the release tag is $TAG. Bump package.json first."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
