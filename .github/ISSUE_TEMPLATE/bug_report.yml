name: Bug report
description: Something didn't bridge the way you expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, and what went wrong?
      placeholder: "I ran `anyagent sync --to codex` and ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`anyagent doctor` output"
      description: Paste the output of `anyagent doctor --root <your workspace>`.
      render: shell
  - type: input
    id: version
    attributes:
      label: anyagent version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v20.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
